<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 老虎单色剪影，用于 Safari 固定标签页（mask-icon 要求单色，由 layout 的 color 属性着色） -->
  <!-- 耳朵 -->
  <path d="M24 30 L16 8 L42 22 Z"/>
  <path d="M76 30 L84 8 L58 22 Z"/>
  <!-- 脸 -->
  <ellipse cx="50" cy="55" rx="30" ry="28"/>
  <!-- 嘴部白色区域挖空 -->
  <ellipse cx="50" cy="70" rx="14" ry="11" fill="#000" stroke="none"/>
  <!-- 眼睛挖空 -->
  <circle cx="38" cy="52" r="4" fill="#000"/>
  <circle cx="62" cy="52" r="4" fill="#000"/>
  <g fill="#fff" stroke="none">
    <ellipse cx="50" cy="70" rx="14" ry="11"/>
    <circle cx="38" cy="52" r="4"/>
    <circle cx="62" cy="52" r="4"/>
  </g>
</svg>
