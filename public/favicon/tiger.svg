<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 背景：圆角方形，与博客暗色主题一致 -->
  <rect width="100" height="100" rx="22" fill="#0d1015"/>

  <!-- 耳朵 -->
  <path d="M24 30 L16 8 L42 22 Z" fill="#e8751a"/>
  <path d="M76 30 L84 8 L58 22 Z" fill="#e8751a"/>
  <path d="M28 25 L22 14 L36 22 Z" fill="#0d1015"/>
  <path d="M72 25 L78 14 L64 22 Z" fill="#0d1015"/>

  <!-- 脸 -->
  <ellipse cx="50" cy="55" rx="30" ry="28" fill="#ff8c1a"/>

  <!-- 白色嘴部 -->
  <ellipse cx="50" cy="70" rx="16" ry="13" fill="#fff5e6"/>

  <!-- 额头"王"字纹 -->
  <path d="M50 34 L50 47" stroke="#1a1a2e" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M41 36 L59 36" stroke="#1a1a2e" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M41 41 L59 41" stroke="#1a1a2e" stroke-width="3.5" stroke-linecap="round"/>

  <!-- 脸颊条纹 -->
  <path d="M24 48 Q28 52 26 60" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M76 48 Q72 52 74 60" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M22 58 Q26 62 24 68" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M78 58 Q74 62 76 68" stroke="#1a1a2e" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- 眼睛 -->
  <circle cx="38" cy="52" r="4.5" fill="#1a1a2e"/>
  <circle cx="62" cy="52" r="4.5" fill="#1a1a2e"/>
  <circle cx="39.5" cy="50.5" r="1.5" fill="#fff5e6"/>
  <circle cx="63.5" cy="50.5" r="1.5" fill="#fff5e6"/>

  <!-- 鼻子 -->
  <path d="M45 62 Q50 59 55 62 L50 67 Z" fill="#c4400a"/>

  <!-- 嘴 -->
  <path d="M50 67 L50 71" stroke="#1a1a2e" stroke-width="2" stroke-linecap="round"/>
  <path d="M50 71 Q44 75 39 72" stroke="#1a1a2e" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M50 71 Q56 75 61 72" stroke="#1a1a2e" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>
